group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

}

tasks.register('verifyNativeLibraries') {
    doLast {
        ['arm64-v8a', 'armeabi-v7a', 'x86_64'].each { abi ->
            ['libmpv.so', 'libmediakitandroidhelper.so'].each { library ->
                if (!file("src/main/jniLibs/$abi/$library").exists()) {
                    throw new GradleException("Build our $abi libraries first: ANDROID_ABI=$abi packages/playback/tool/build_libmpv_android.sh")
                }
            }
        }
    }
}
preBuild.dependsOn('verifyNativeLibraries')
