name: ui
description: All widgets, navigation and focus behaviour.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  contracts:
    path: ../contracts
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  skeletonizer: ^3.0.0
  phosphor_flutter:
    path: third_party/phosphor_flutter
  intl: ^0.20.3
  shamsi_date: ^1.1.1
  flutter_localizations:
    sdk: flutter
  flutter_thinking_orbs: ^0.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
