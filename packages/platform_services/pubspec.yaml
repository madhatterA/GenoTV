name: platform_services
description: HDR, display mode switching, audio passthrough, lifecycle.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  contracts:
    path: ../contracts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  media_kit: ^1.2.6

flutter:
  plugin:
    platforms:
      android:
        package: com.genotv.platform_services
        pluginClass: PlatformServicesPlugin
      ios:
        pluginClass: PlatformServicesPlugin
      macos:
        pluginClass: PlatformServicesPlugin
      windows:
        pluginClass: PlatformServicesPluginCApi
