name: cast
description: Chromecast and DLNA casting (forked from dart_cast), cast proxy and subtitle conversion.
version: 0.0.1
publish_to: 'none'

environment:
  flutter: ">=3.3.0"
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  multicast_dns: ^0.3.2+6
  protobuf: ^6.0.0

dev_dependencies:
  test: ^1.25.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: CastPlugin
      macos:
        pluginClass: CastPlugin
      windows:
        ffiPlugin: true
