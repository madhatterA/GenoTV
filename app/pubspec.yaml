name: video_player
description: Runner app and composition root. Owned by Part 07.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # tvOS implementations of plugins the app already uses (fluttertv.dev, owner
  # approved 2026-10-29); other platforms ignore them.
  # 1.8.x declares tvos but ships only an ios/ folder, which flutter-tvos cannot
  # link; 1.7.x has no tvos entry, so wakelock_plus_tvos provides it.
  wakelock_plus: '>=1.7.0 <1.8.0'
  wakelock_plus_tvos: ^0.0.1
  package_info_plus_tvos: ^0.0.1
  path_provider_tvos: ^0.0.3

  core:
    path: ../packages/core
  contracts:
    path: ../packages/contracts
  persistence:
    path: ../packages/persistence
  playback:
    path: ../packages/playback
  transport:
    path: ../packages/transport
  ui:
    path: ../packages/ui
  platform_services:
    path: ../packages/platform_services
  content_sources:
    path: ../packages/content_sources
  cast:
    path: ../packages/cast
  file_selector: ^1.0.3
  media_kit: ^1.2.6
  media_kit_libs_tvos_video:
    path: ../packages/media_kit_libs_tvos_video
  url_launcher: ^6.3.3

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_surface:
    path: ../packages/video_surface

flutter:
  uses-material-design: true
  assets:
    - assets/Butterfly-209.mp4

dependency_overrides:
  media_kit:
    path: ../packages/media_kit
  media_kit_video:
    path: ../packages/media_kit_video
  media_kit_libs_android_video:
    path: ../packages/media_kit_libs_android_video
  media_kit_libs_ios_video:
    path: ../packages/media_kit_libs_ios_video
  media_kit_libs_macos_video:
    path: ../packages/media_kit_libs_macos_video
  media_kit_libs_windows_video:
    path: ../packages/media_kit_libs_windows_video
