name: release

on:
  push:
    tags: ['v*']
    branches: [ci/release]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build tools
        run: brew install cmake ninja autoconf automake libtool pkg-config nasm gettext
      - name: Native build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/aria2-src-*
            ~/cast-ffmpeg
            /tmp/transport-macos-native-*
          key: macos-native-${{ hashFiles('packages/transport/tool/**', 'packages/transport/src/lt_shim/**', 'packages/cast/tool/build_ffmpeg.sh') }}
      - name: Build
        working-directory: app
        env:
          CAST_FFMPEG_CACHE: ${{ github.workspace }}/../cast-ffmpeg
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/*.app GenoTV-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GenoTV-macos-arm64
          path: GenoTV-macos-arm64.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Native DLLs (libtorrent/aria2 shims, FFmpeg remux) are prebuilt and committed,
      # like the macOS dylibs and Android .so files; rebuild them with the scripts in
      # packages/transport/tool and packages/cast/tool when their sources change.
      - name: Build
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath GenoTV-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GenoTV-windows-x64
          path: GenoTV-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk GenoTV-android.apk
          unzip -l GenoTV-android.apk | grep 'lib/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GenoTV-android
          path: GenoTV-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
